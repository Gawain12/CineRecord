version: '3.8'

services:
  cinerecord:
    build: .
    container_name: cinerecord
    ports:
      - "8000:8000"
    volumes:
      # Persist config and data
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - CINERECORD_HOST=0.0.0.0
    restart: unless-stopped

