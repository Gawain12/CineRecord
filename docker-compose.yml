services:
  cinerecord:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinerecord
    ports:
      - "${CINERECORD_PORT:-18000}:18000"
    volumes:
      - ./cinerecord-data:/var/lib/cinerecord
    environment:
      CINERECORD_HOST: 0.0.0.0
      CINERECORD_PORT: 18000
      RUST_LOG: info,tower_http=warn
    restart: unless-stopped
