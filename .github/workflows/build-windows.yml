name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows EXE
        run: |
          pyinstaller CineRecord_windows.spec --clean
      
      - name: Test EXE exists
        run: |
          if (!(Test-Path "dist\CineRecord.exe")) {
            Write-Error "EXE not found!"
            exit 1
          }
          Write-Host "✓ EXE built successfully: $(Get-Item dist\CineRecord.exe | Select-Object -ExpandProperty Length) bytes"
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CineRecord-Windows
          path: dist/CineRecord.exe
          retention-days: 30
      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CineRecord.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
