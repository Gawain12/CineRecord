name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============================================
  # Windows Build
  # ============================================
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global --add safe.directory "*"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller pywebview pythonnet simple_websocket
      
      - name: Build Windows EXE
        run: |
          pyinstaller CineRecord_windows.spec --clean --noconfirm
      
      - name: Test EXE exists
        run: |
          if (!(Test-Path "dist\CineRecord\CineRecord.exe")) {
            Write-Error "EXE not found!"
            exit 1
          }
          $size = (Get-Item "dist\CineRecord\CineRecord.exe").Length / 1MB
          Write-Host "✓ EXE built successfully. Size: $([math]::Round($size, 2)) MB"
      
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist\CineRecord\*" -DestinationPath "dist\CineRecord-Windows.zip"
          Write-Host "✓ ZIP Size: $([math]::Round((Get-Item 'dist\CineRecord-Windows.zip').Length / 1MB, 2)) MB"
      
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CineRecord-Windows
          path: dist/CineRecord-Windows.zip
          retention-days: 30

  # ============================================
  # macOS Build
  # ============================================
  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global --add safe.directory "*"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install UPX
        run: |
          brew install upx
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller pywebview pyobjc-framework-Cocoa
      
      - name: Build macOS App
        run: |
          pyinstaller CineRecord.spec --clean
      
      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -r dist/CineRecord.app dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "CineRecord" -srcfolder dmg_temp -ov -format UDBZ dist/CineRecord.dmg
          rm -rf dmg_temp
          echo "✓ DMG Size: $(du -h dist/CineRecord.dmg | cut -f1)"
      
      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: CineRecord-macOS
          path: |
            dist/CineRecord.dmg
          retention-days: 30

  # ============================================
  # Create Release (when tag pushed)
  # ============================================
  release:
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CineRecord-Windows
          path: ./release/windows
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: CineRecord-macOS
          path: ./release/macos
      
      - name: List release files
        run: |
          ls -la ./release/
          ls -la ./release/windows/ || true
          ls -la ./release/macos/ || true
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/CineRecord-Windows.zip
            release/macos/CineRecord.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
