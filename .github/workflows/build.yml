name: Rust CI and Releases

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/gawain12/cinerecord

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
      - name: Check browser JavaScript
        run: node --check web/static/rust-v2.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag cinerecord:ci .
      - name: Smoke test Docker image
        run: |
          docker run --detach --rm \
            --name cinerecord-smoke \
            --publish 18001:18000 \
            cinerecord:ci
          trap "docker stop cinerecord-smoke >/dev/null 2>&1 || true" EXIT
          for _ in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:18001/api/v2/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18001/api/v2/health
          curl --fail --silent http://127.0.0.1:18001/ >/dev/null
          curl --fail --silent http://127.0.0.1:18001/static/rust-v2.js >/dev/null
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-windows:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows client
        env:
          CINERECORD_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: scripts/package_rust_windows.ps1
      - name: Validate Windows executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist-rust\CineRecord-Windows-x64.exe"
          $zip = Join-Path $PWD "dist-rust\CineRecord-Windows-x64.zip"
          if (!(Test-Path $exe)) { throw "Standalone CineRecord.exe was not created" }
          if (!(Test-Path $zip)) { throw "Windows ZIP was not created" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Windows executable is unexpectedly small" }
          if ((Get-Item $zip).Length -lt 1MB) { throw "Windows ZIP is unexpectedly small" }
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne "CineRecord") { throw "Windows ProductName resource is missing" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "Windows executable icon is missing" }
          $icon.Dispose()
      - name: Smoke test Windows client
        shell: pwsh
        run: |
          $env:CINERECORD_HOME = Join-Path $env:RUNNER_TEMP "cinerecord-smoke"
          $env:CINERECORD_PORT = "18001"
          $env:CINERECORD_NO_BROWSER = "1"
          $binary = Join-Path $PWD "dist-rust\CineRecord-Windows-x64.exe"
          $process = Start-Process $binary -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 "http://127.0.0.1:18001/api/v2/health" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw "CineRecord did not become ready" }
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18001/" | Out-Null
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18001/static/rust-v2.js" | Out-Null
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CineRecord-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            dist-rust/CineRecord-Windows-x64.exe
            dist-rust/CineRecord-Windows-x64.zip
            dist-rust/CineRecord-Windows-x64.sha256

  build-macos-arm:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS ARM package
        env:
          CINERECORD_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/package_rust_macos.sh
          scripts/package_rust_macos.sh
      - name: Validate macOS package
        run: |
          test -s dist-rust/CineRecord.app/Contents/Resources/CineRecord.icns
          codesign --verify --deep --strict dist-rust/CineRecord.app
          hdiutil verify dist-rust/CineRecord-macOS-arm64.dmg
      - name: Smoke test macOS binary
        run: |
          export CINERECORD_HOME="$RUNNER_TEMP/cinerecord-smoke"
          export CINERECORD_PORT=18001
          cp dist-rust/CineRecord.app/Contents/Resources/cinerecord-server "$RUNNER_TEMP/cinerecord-server"
          chmod +x "$RUNNER_TEMP/cinerecord-server"
          xattr -c "$RUNNER_TEMP/cinerecord-server" || true
          "$RUNNER_TEMP/cinerecord-server" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for _ in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:18001/api/v2/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18001/api/v2/health
          curl --fail --silent http://127.0.0.1:18001/ >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: CineRecord-macOS-arm64
          retention-days: 30
          if-no-files-found: error
          path: |
            dist-rust/CineRecord-macOS-arm64.dmg
            dist-rust/CineRecord-macOS-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, build-windows, build-macos-arm]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
